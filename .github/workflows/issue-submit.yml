name: 投稿解析与邮件通知

on:
  issues:
    types: [opened, edited]

permissions:
  issues: read
  contents: read

jobs:
  parse-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 写入解析脚本
        run: |
          cat << 'PYSCRIPT' > parse_issue.py
          import re, json, os

          body = os.environ.get('ISSUE_BODY', '')
          title = os.environ.get('ISSUE_TITLE', '')
          url = os.environ.get('ISSUE_URL', '')
          number = os.environ.get('ISSUE_NUMBER', '0')
          submitter = os.environ.get('SUBMITTER', '')

          FIELD_RE = re.compile(r'^[a-z][a-z0-9]*(_[a-z0-9]+)*:[ \t]*$', re.I)
          SKIP_VALUES = ('', '___', '未填', '未知')
          URL_RE = re.compile(r'^(https?://|ftp://|www\.)', re.I)

          def split_top_level(text):
              idx = text.find('\n# ')
              if idx == -1:
                  return text, []
              top = text[:idx]
              rest = text[idx+1:]
              sections = []
              pattern = re.compile(r'^#[ \t].+$', re.M)
              matches = list(pattern.finditer(rest))
              for i, m in enumerate(matches):
                  start = m.end()
                  end = matches[i+1].start() if i+1 < len(matches) else len(rest)
                  sections.append((m.group(0).strip(), rest[start:end]))
              return top, sections

          def gf(text, key):
              pat = re.compile(r'^' + re.escape(key) + r'[ \t]*:[ \t]*([^\r\n]*)', re.M)
              m = pat.search(text)
              if not m:
                  return ''
              val = m.group(1).strip()
              if val in SKIP_VALUES:
                  return ''
              return val

          def gmf(text, key):
              pat = re.compile(r'^' + re.escape(key) + r'[ \t]*:[ \t]*([^\r\n]*)', re.M)
              m = pat.search(text)
              if not m:
                  return []
              results = []
              inline = m.group(1).strip()
              if inline and inline not in SKIP_VALUES and not inline.startswith('>') and not inline.startswith('💡'):
                  for part in re.split(r'[,，]', inline):
                      part = part.strip()
                      if part and part not in SKIP_VALUES and not part.startswith('>') and not part.startswith('💡'):
                          results.append(part)
              tail = text[m.end():]
              for line in tail.split('\n'):
                  line = line.rstrip()
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if FIELD_RE.match(line):
                      break
                  if stripped.startswith('#'):
                      break
                  if stripped.startswith('>'):
                      continue
                  if stripped.startswith('💡') or stripped.startswith('📍') or stripped.startswith('🔔'):
                      continue
                  if not URL_RE.match(stripped) and not stripped.startswith('http'):
                      if results:
                          break
                      continue
                  for part in re.split(r'[,，]', stripped):
                      part = part.strip()
                      if part and part not in SKIP_VALUES and not part.startswith('>') and not part.startswith('💡'):
                          results.append(part)
              return results

          top_body, sections = split_top_level(body)

          name = gf(top_body, 'name')
          region = gf(top_body, 'region')
          city = gf(top_body, 'city')
          address = gf(top_body, 'address')
          open_year = gf(top_body, 'open_year')
          close_year = gf(top_body, 'close_year')
          status_key = gf(top_body, 'status_key')
          status = gf(top_body, 'status')
          photo_urls = gmf(top_body, 'photo_urls')
          if not photo_urls:
              single = gf(top_body, 'photo_url')
              photo_urls = [single] if single else []

          valid_keys = ('still_open_original', 'moved_same_building', 'moved_far_away', 'building_gone')
          if status_key not in valid_keys:
              status_key = 'pending-review'

          locations = []
          loc_sections = []
          for sec_title, sec_body in sections:
              label_match = re.search(r'location_(\d+)_label', sec_body)
              if label_match:
                  seq = int(label_match.group(1))
              else:
                  nm = re.search(r'第\s*(\d+)\s*项', sec_title)
                  if nm:
                      seq = int(nm.group(1))
                  else:
                      continue
              loc_sections.append((seq, sec_body))

          loc_sections.sort(key=lambda x: x[0])

          for seq, sec in loc_sections:
              loc = {
                  'seq': seq,
                  'label': gf(sec, f'location_{seq}_label') or f'位置{seq}',
                  'address': gf(sec, f'location_{seq}_address') or '',
                  'open_year': gf(sec, f'location_{seq}_open_year') or '',
                  'close_year': gf(sec, f'location_{seq}_close_year') or '',
              }
              coord_pat = re.compile(
                  r'location_' + str(seq) + r'_coordinates[ \t]*:[ \t]*\[([\d\.\-]+),[ \t]*([\d\.\-]+)\]')
              cm = coord_pat.search(sec)
              if cm:
                  loc['coordinates'] = [float(cm.group(1)), float(cm.group(2))]
              lp = gmf(sec, f'location_{seq}_photo_urls')
              if not lp:
                  single = gf(sec, f'location_{seq}_photo_url')
                  if single:
                      lp = [single]
              if lp:
                  loc['photo_urls'] = lp
              locations.append(loc)

          lng, lat = None, None
          for i in range(len(locations) - 1, -1, -1):
              if 'coordinates' in locations[i]:
                  lng = locations[i]['coordinates'][0]
                  lat = locations[i]['coordinates'][1]
                  break
          if lng is None:
              cm = re.search(r'\[([\d\.\-]+),\s*([\d\.\-]+)\]', body)
              if cm:
                  lng, lat = float(cm.group(1)), float(cm.group(2))

          missing = []
          if not name: missing.append('name')
          if not city: missing.append('city')
          if status_key == 'pending-review': missing.append('status_key')
          if not status: missing.append('status')
          if not address and not locations: missing.append('address/locations')

          props = {
              'name': name or '待补充门店名称',
              'region': region or '待人工补充',
              'city': city or '待人工补充',
              'address': address or '',
              'open_year': open_year or '',
              'close_year': close_year or '',
              'status_key': status_key,
              'status': status or '待人工补充',
              'photo_urls': photo_urls,
          }
          if locations:
              props['locations'] = locations

          feat = {'type': 'Feature', 'properties': props}
          if lng is not None and lat is not None:
              feat['geometry'] = {'type': 'Point', 'coordinates': [lng, lat]}

          result = {
              'issue_title': title,
              'issue_url': url,
              'issue_number': int(number) if str(number).isdigit() else number,
              'submitter': submitter,
              'missing_fields': missing,
              'feature': feat,
          }

          with open('result.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          feat_json = json.dumps(feat, ensure_ascii=False)
          ghenv = os.environ.get('GITHUB_ENV', '')
          with open(ghenv, 'a', encoding='utf-8') as f:
              f.write('FEATURE_NAME=' + (name or '未知门店') + '\n')
              f.write('FEATURE_CITY=' + (city or '未知') + '\n')
              f.write('FEATURE_STATUS=' + status_key + '\n')
              f.write('FEATURE_JSON=' + feat_json + '\n')

          ghout = os.environ.get('GITHUB_OUTPUT', '')
          with open(ghout, 'a', encoding='utf-8') as f:
              f.write('feature_name=' + (name or '未知门店') + '\n')
              f.write('feature_city=' + (city or '未知') + '\n')
              f.write('feature_status=' + status_key + '\n')
              f.write('missing_count=' + str(len(missing)) + '\n')

          print('DONE')
          print(json.dumps(feat, ensure_ascii=False, indent=2))
          if missing:
              print('MISSING: ' + ', '.join(missing))
          PYSCRIPT

      - name: 运行解析脚本
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: python3 parse_issue.py

      - name: 输出解析结果
        run: |
          echo "=== 解析结果 ==="
          cat result.json
          echo "=== 环境变量 ==="
          echo "FEATURE_NAME=$FEATURE_NAME"
          echo "FEATURE_CITY=$FEATURE_CITY"
          echo "FEATURE_STATUS=$FEATURE_STATUS"
          echo "FEATURE_JSON=$FEATURE_JSON"

      - name: 发送邮件通知
        if: ${{ env.FEATURE_NAME != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "【麦当劳旧址投稿】#${{ github.event.issue.number }} ${{ github.event.issue.title }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            🔔 仓库收到新门店投稿！

            Issue 链接：${{ github.event.issue.html_url }}
            投稿人：${{ github.event.issue.user.login }}

            =====================
            自动生成待审核 GeoJSON Feature：
            ```json
            ${{ env.FEATURE_JSON }}
            ```

            =====================
            请登录 GitHub 审核后合并至 data/sample.geojson

            —— 麦当劳旧址档案项目机器人
