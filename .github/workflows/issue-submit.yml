name: 投稿解析与邮件通知

on:
  issues:
    types: [opened, edited]

permissions:
  issues: read
  contents: read

jobs:
  parse-and-notify:
    runs-on: ubuntu-latest
    env:
      MAIL_FROM_SEC: ${{ secrets.MAIL_FROM }}
      MAIL_TO_SEC: ${{ secrets.MAIL_TO }}
      SMTP_SERVER_SEC: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT_SEC: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE_SEC: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME_SEC: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD_SEC: ${{ secrets.SMTP_PASSWORD }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SUBMITTER: ${{ github.event.issue.user.login }}
    steps:
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 写入解析脚本
        run: |
          cat << 'PYSCRIPT' > parse_issue.py
          import re, json, os, urllib.parse

          body = os.environ.get('ISSUE_BODY', '')
          title = os.environ.get('ISSUE_TITLE', '')
          url = os.environ.get('ISSUE_URL', '')
          number = os.environ.get('ISSUE_NUMBER', '0')
          submitter = os.environ.get('SUBMITTER', '')

          FIELD_RE = re.compile(r'^[a-z][a-z0-9]*(_[a-z0-9]+)*:[ \t]*$', re.I)
          SKIP_VALUES = ('', '___', '未填', '未知')
          URL_RE = re.compile(r'^(https?://|ftp://|www\.)', re.I)
          GOOGLE_IMGRES_RE = re.compile(r'google\.com/imgres.*?[?&]imgurl=([^&]+)', re.I)

          def clean_url(raw):
              if not raw:
                  return ''
              url = raw.strip()
              url = url.strip('`').strip('*').strip()
              if url.startswith('>') or url.startswith('💡') or url.startswith('📍') or url.startswith('🔔'):
                  return ''
              gm = GOOGLE_IMGRES_RE.search(url)
              if gm:
                  url = urllib.parse.unquote(gm.group(1))
              return url

          def split_top_level(text):
              idx = text.find('\n# ')
              if idx == -1:
                  return text, []
              top = text[:idx]
              rest = text[idx+1:]
              sections = []
              pattern = re.compile(r'^#[ \t].+$', re.M)
              matches = list(pattern.finditer(rest))
              for i, m in enumerate(matches):
                  start = m.end()
                  end = matches[i+1].start() if i+1 < len(matches) else len(rest)
                  sections.append((m.group(0).strip(), rest[start:end]))
              return top, sections

          def gf(text, key):
              pat = re.compile(r'^' + re.escape(key) + r'[ \t]*:[ \t]*([^\r\n]*)', re.M)
              m = pat.search(text)
              if not m:
                  return ''
              val = m.group(1).strip()
              if val in SKIP_VALUES:
                  return ''
              return val

          def gmf(text, key):
              pat = re.compile(r'^' + re.escape(key) + r'[ \t]*:[ \t]*([^\r\n]*)', re.M)
              m = pat.search(text)
              if not m:
                  return []
              results = []
              inline = m.group(1).strip()
              if inline and inline not in SKIP_VALUES and not inline.startswith('>') and not inline.startswith('💡'):
                  for part in re.split(r'[,，\s]+', inline):
                      part = clean_url(part)
                      if part:
                          results.append(part)
              tail = text[m.end():]
              for line in tail.split('\n'):
                  line = line.rstrip()
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if FIELD_RE.match(line):
                      break
                  if stripped.startswith('#'):
                      break
                  if stripped.startswith('>'):
                      continue
                  if stripped.startswith('💡') or stripped.startswith('📍') or stripped.startswith('🔔'):
                      continue
                  if not URL_RE.match(stripped) and not stripped.startswith('http'):
                      if results:
                          break
                      continue
                  for part in re.split(r'[,，\s]+', stripped):
                      part = clean_url(part)
                      if part:
                          results.append(part)
              return results

          top_body, sections = split_top_level(body)

          first_section_body = sections[0][1] if sections else ''

          name = gf(top_body, 'name') or gf(first_section_body, 'name')
          region = gf(top_body, 'region') or gf(first_section_body, 'region')
          city = gf(top_body, 'city') or gf(first_section_body, 'city')
          address = gf(top_body, 'address') or gf(first_section_body, 'address')
          open_year = gf(top_body, 'open_year') or gf(first_section_body, 'open_year')
          close_year = gf(top_body, 'close_year') or gf(first_section_body, 'close_year')
          status_key = gf(top_body, 'status_key') or gf(first_section_body, 'status_key')
          status = gf(top_body, 'status') or gf(first_section_body, 'status')
          photo_urls = gmf(top_body, 'photo_urls') or gmf(first_section_body, 'photo_urls')
          if not photo_urls:
              single = gf(top_body, 'photo_url') or gf(first_section_body, 'photo_url')
              cu = clean_url(single)
              photo_urls = [cu] if cu else []

          valid_keys = ('still_open_original', 'moved_same_building', 'moved_far_away', 'building_gone')
          if status_key not in valid_keys:
              status_key = 'pending-review'

          locations = []
          loc_sections = []
          for sec_title, sec_body in sections:
              label_match = re.search(r'location_(\d+)_label', sec_body)
              if label_match:
                  seq = int(label_match.group(1))
              else:
                  nm = re.search(r'第\s*(\d+)\s*项', sec_title)
                  if nm:
                      seq = int(nm.group(1))
                  else:
                      continue
              loc_sections.append((seq, sec_body))

          loc_sections.sort(key=lambda x: x[0])

          for seq, sec in loc_sections:
              label_val = gf(sec, f'location_{seq}_label')
              address_val = gf(sec, f'location_{seq}_address')
              open_year_val = gf(sec, f'location_{seq}_open_year')
              close_year_val = gf(sec, f'location_{seq}_close_year')
              coord_pat = re.compile(
                  r'location_' + str(seq) + r'_coordinates[ \t]*:[ \t]*\[([\d\.\-]+),[ \t]*([\d\.\-]+)\]')
              cm = coord_pat.search(sec)
              if not cm:
                  cm = re.search(r'\[([\d\.\-]+),[ \t]*([\d\.\-]+)\]', sec)

              eff_label = label_val or gf(sec, 'name') or f'位置{seq}'
              eff_address = address_val or gf(sec, 'address') or ''
              eff_open_year = open_year_val or gf(sec, 'open_year') or ''
              eff_close_year = close_year_val or gf(sec, 'close_year') or ''

              loc = {
                  'seq': seq,
                  'label': eff_label,
                  'address': eff_address,
                  'open_year': eff_open_year,
                  'close_year': eff_close_year,
              }
              if cm:
                  loc['coordinates'] = [float(cm.group(1)), float(cm.group(2))]
              lp = gmf(sec, f'location_{seq}_photo_urls')
              if not lp:
                  single = gf(sec, f'location_{seq}_photo_url')
                  if single:
                      cu = clean_url(single)
                      lp = [cu] if cu else []
              if not lp:
                  lp = gmf(sec, 'photo_urls')
              if not lp:
                  single = gf(sec, 'photo_url')
                  if single:
                      cu = clean_url(single)
                      lp = [cu] if cu else []
              if lp:
                  loc['photo_urls'] = lp
              has_data = eff_address or eff_open_year or eff_close_year or loc.get('coordinates') or lp
              if not has_data:
                  continue
              locations.append(loc)

          lng, lat = None, None
          for i in range(len(locations) - 1, -1, -1):
              if 'coordinates' in locations[i]:
                  lng = locations[i]['coordinates'][0]
                  lat = locations[i]['coordinates'][1]
                  break
          if lng is None:
              cm = re.search(r'\[([\d\.\-]+),\s*([\d\.\-]+)\]', body)
              if cm:
                  lng, lat = float(cm.group(1)), float(cm.group(2))

          missing = []
          if not name: missing.append('name')
          if not city: missing.append('city')
          if status_key == 'pending-review': missing.append('status_key')
          if not status: missing.append('status')
          if not address and not locations: missing.append('address/locations')

          props = {
              'name': name or '待补充门店名称',
              'region': region or '待人工补充',
              'city': city or '待人工补充',
              'address': address or '',
              'open_year': open_year or '',
              'close_year': close_year or '',
              'status_key': status_key,
              'status': status or '待人工补充',
              'photo_urls': photo_urls,
          }
          if locations:
              props['locations'] = locations

          feat = {'type': 'Feature', 'properties': props}
          if lng is not None and lat is not None:
              feat['geometry'] = {'type': 'Point', 'coordinates': [lng, lat]}

          result = {
              'issue_title': title,
              'issue_url': url,
              'issue_number': int(number) if str(number).isdigit() else number,
              'submitter': submitter,
              'missing_fields': missing,
              'feature': feat,
          }

          with open('result.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          feat_json = json.dumps(feat, ensure_ascii=False)
          ghenv = os.environ.get('GITHUB_ENV', '')
          with open(ghenv, 'a', encoding='utf-8') as f:
              f.write('FEATURE_NAME=' + (name or '未知门店') + '\n')
              f.write('FEATURE_CITY=' + (city or '未知') + '\n')
              f.write('FEATURE_STATUS=' + status_key + '\n')
              f.write('FEATURE_JSON=' + feat_json + '\n')

          ghout = os.environ.get('GITHUB_OUTPUT', '')
          with open(ghout, 'a', encoding='utf-8') as f:
              f.write('feature_name=' + (name or '未知门店') + '\n')
              f.write('feature_city=' + (city or '未知') + '\n')
              f.write('feature_status=' + status_key + '\n')
              f.write('missing_count=' + str(len(missing)) + '\n')

          print('DONE')
          print(json.dumps(feat, ensure_ascii=False, indent=2))
          if missing:
              print('MISSING: ' + ', '.join(missing))
          PYSCRIPT

      - name: 运行解析脚本
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 parse_issue.py

      - name: 输出解析结果
        run: |
          echo "=== 解析结果 ==="
          cat result.json
          echo ""
          echo "=== 解析摘要 ==="
          python3 -c "import json; d=json.load(open('result.json','r',encoding='utf-8')); f=d['feature']['properties']; print(f'name: {f[\"name\"]}'); print(f'city: {f[\"city\"]}'); print(f'status: {f[\"status_key\"]}'); print(f'missing: {d[\"missing_fields\"]}')"
          FN=$(python3 -c "import json; d=json.load(open('result.json','r',encoding='utf-8')); print(d['feature']['properties']['name'])")
          echo "FEATURE_NAME=$FN"
          echo "=== Secrets 配置状态 ==="
          if [ -n "$MAIL_FROM_SEC" ] && [ -n "$SMTP_SERVER_SEC" ] && [ -n "$SMTP_USERNAME_SEC" ] && [ -n "$SMTP_PASSWORD_SEC" ]; then
            echo "✅ SMTP secrets 已配置，将尝试发送邮件"
          else
            echo "⚠️ SMTP secrets 未完整配置，跳过邮件发送"
            echo "   需要配置 7 个 secrets: SMTP_SERVER, SMTP_PORT, SMTP_SECURE, SMTP_USERNAME, SMTP_PASSWORD, MAIL_FROM, MAIL_TO"
          fi

      - name: 写入邮件脚本
        run: |
          cat << 'EMAILSCRIPT' > send_email.py
          import smtplib, ssl, os, sys, json
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.header import Header

          smtp_server = os.environ.get('SMTP_SERVER_SEC', '')
          smtp_port = int(os.environ.get('SMTP_PORT_SEC', '465'))
          smtp_secure = os.environ.get('SMTP_SECURE_SEC', 'true').lower() == 'true'
          username = os.environ.get('SMTP_USERNAME_SEC', '')
          password = os.environ.get('SMTP_PASSWORD_SEC', '')
          mail_from = os.environ.get('MAIL_FROM_SEC', '')
          mail_to = os.environ.get('MAIL_TO_SEC', '')
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_url = os.environ.get('ISSUE_URL', '')
          issue_number = os.environ.get('ISSUE_NUMBER', '')
          submitter = os.environ.get('SUBMITTER', '')

          try:
              with open('result.json', 'r', encoding='utf-8') as f:
                  result = json.load(f)
              feature_json = json.dumps(result['feature'], ensure_ascii=False)
              feature_name = result['feature']['properties'].get('name', '')
          except Exception as e:
              print('FAIL: Cannot read result.json: ' + str(e))
              sys.exit(1)

          if not smtp_server or not username or not password or not mail_from or not mail_to:
              print('SMTP secrets missing, skip sending')
              sys.exit(0)

          subject = Header('【麦当劳旧址投稿】#' + issue_number + ' ' + issue_title, 'utf-8')
          body_lines = [
              '🔔 仓库收到新门店投稿！',
              '',
              'Issue 链接：' + issue_url,
              '投稿人：' + submitter,
              '',
              '=====================',
              '自动生成待审核 GeoJSON Feature：',
              '```json',
              feature_json,
              '```',
              '',
              '=====================',
              '请登录 GitHub 审核后合并至 data/sample.geojson',
              '',
              '—— 麦当劳旧址档案项目机器人',
          ]
          body_text = '\n'.join(body_lines)

          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = mail_from
          msg['To'] = mail_to

          html_body = body_text.replace('\n', '<br>')
          html_body = html_body.replace('```json', '<pre>').replace('```', '</pre>')
          msg.attach(MIMEText(body_text, 'plain', 'utf-8'))
          msg.attach(MIMEText(html_body, 'html', 'utf-8'))

          recipients = [addr.strip() for addr in mail_to.split(',')]

          try:
              if smtp_secure:
                  print('Connecting to ' + smtp_server + ':' + str(smtp_port) + ' via SSL...')
                  context = ssl.create_default_context()
                  with smtplib.SMTP_SSL(smtp_server, smtp_port, context=context, timeout=30) as server:
                      server.login(username, password)
                      server.sendmail(mail_from, recipients, msg.as_string())
                  print('OK: Email sent via SSL')
              else:
                  print('Connecting to ' + smtp_server + ':' + str(smtp_port) + ' via STARTTLS...')
                  with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                      server.ehlo()
                      server.starttls(context=ssl.create_default_context())
                      server.ehlo()
                      server.login(username, password)
                      server.sendmail(mail_from, recipients, msg.as_string())
                  print('OK: Email sent via STARTTLS')
          except smtplib.SMTPAuthenticationError as e:
              print('FAIL: SMTP auth failed: ' + str(e))
              print('Check SMTP_USERNAME and SMTP_PASSWORD (QQ mail needs authorization code)')
              sys.exit(1)
          except smtplib.SMTPRecipientsRefused as e:
              print('FAIL: Recipient refused: ' + str(e))
              sys.exit(1)
          except smtplib.SMTPException as e:
              print('FAIL: SMTP error: ' + str(e))
              sys.exit(1)
          except Exception as e:
              print('FAIL: Connection error: ' + type(e).__name__ + ': ' + str(e))
              print('Possible causes: wrong port/encryption, bad auth code, network issue')
              sys.exit(1)
          EMAILSCRIPT

      - name: 发送邮件通知
        run: python3 send_email.py
